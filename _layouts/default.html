<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/assets/logo.png' | absolute_url }}">
  <meta name="theme-color" content="#ff5470">
  <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body class="{% if page.home %}home{% else %}doc{% endif %}">
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/logo.png' | relative_url }}" alt="" width="34" height="34">{{ site.title }}</a>
      <nav>
        <a href="{{ '/terms/' | relative_url }}">Terms</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a class="btn small" href="{{ site.invite_url }}">Add to Discord</a>
      </nav>
    </div>
  </header>

  {% if page.home %}
    {{ content }}
  {% else %}
    <section class="doc-hero">
      <div class="wrap">
        <p class="kicker">Legal</p>
        <h1>{{ page.title }}</h1>
        <p class="sub">Plain-English, short, and honest. Last updated November 2026.</p>
      </div>
    </section>
    <main class="wrap prose">{{ content }}</main>
  {% endif %}

  <footer class="foot">
    <div class="wrap foot-row">
      <span class="brand small"><img src="{{ '/assets/logo.png' | relative_url }}" alt="" width="22" height="22">{{ site.title }}</span>
      <span class="links"><a href="{{ '/terms/' | relative_url }}">Terms</a><a href="{{ '/privacy/' | relative_url }}">Privacy</a><a href="{{ site.invite_url }}">Add to Discord</a></span>
      <span class="muted">Not affiliated with Discord Inc.</span>
    </div>
  </footer>
</body>
</html>
